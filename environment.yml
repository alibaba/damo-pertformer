name: paper-env
channels:
  - pytorch
  - bioconda
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - setuptools=69.5.1
  - wheel=0.43.0
  - packaging=24.0
  - numpy=2.2.2
  - pandas=2.2.3
  - matplotlib=3.10.0
  - pillow=11.1.0
  - pyyaml=6.0.2
  - requests=2.31.0
  - tqdm=4.66.2

  # PyTorch
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1

  # motif analysis
  - meme

  - pip:
      - accelerate==1.4.0
      - dacite==1.9.2
      - deepspeed==0.16.7
      - einops==0.8.0
      - flash-attn==2.7.4.post1
      - omegaconf==2.3.0
      - regex==2024.11.6
      - safetensors==0.5.2
      - tokenizers==0.21.0
      - torchinfo==1.8.0
      - transformers==4.49.0
      - pybigwig==0.3.24
